<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Abyssinica SIL';src:url(fonts/Abyssinica.ttf)}
@font-face{font-family:Sora;font-weight:400;src:url(fonts/Sora-400.ttf)}
@font-face{font-family:Sora;font-weight:600;src:url(fonts/Sora-600.ttf)}
@font-face{font-family:Sora;font-weight:700;src:url(fonts/Sora-700.ttf)}
@font-face{font-family:Sora;font-weight:800;src:url(fonts/Sora-800.ttf)}
:root{--lilac:#E3BFFD;--purple:#5C0099;--yellow:#FFEB33;--cream:#FFF583;--ink:#03071E;--tint:#D6ACF3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:200px;overflow:hidden}
body{font-family:Sora,sans-serif;background:var(--lilac);position:relative;color:var(--ink)}
svg.sq{position:absolute;inset:0}
.head{position:absolute;left:446px;top:24px;width:340px}
.head small{display:inline-block;background:var(--purple);color:var(--yellow);font-weight:800;font-size:11px;letter-spacing:2px;padding:5px 11px;border-radius:999px;transform:rotate(-3deg)}
.head h1{margin-top:6px;font-family:'Abyssinica SIL',serif;font-weight:400;font-size:30px;line-height:1.02;letter-spacing:-.5px;color:var(--purple)}
.head h1 i{font-style:normal;color:var(--ink)}
.hl{background:linear-gradient(transparent 55%,var(--yellow) 55%,var(--yellow) 92%,transparent 92%);padding:0 2px}
.stats{position:absolute;left:442px;top:132px;display:flex;gap:9px}
.st{border:2.5px solid var(--ink);border-radius:10px;padding:5px 11px 6px;box-shadow:3px 3px 0 var(--ink);font-size:10.5px;font-weight:600;line-height:1.1}
.st b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px}
.s1{background:var(--yellow);transform:rotate(-4deg)}
.s2{background:var(--purple);color:#fff;transform:rotate(3deg)}.s2 b{color:var(--yellow)}
.s3{background:#fff;transform:rotate(-2deg)}
.card{position:absolute;right:58px;top:36px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 8px;box-shadow:6px 6px 0 var(--purple);transform:rotate(2.5deg)}
.card img{display:block;width:348px;height:auto;border-radius:8px}
.tape{position:absolute;top:-12px;left:50%;width:84px;height:22px;margin-left:-42px;background:rgba(255,235,51,.9);transform:rotate(-6deg)}
.logo{position:absolute;right:18px;top:116px;width:76px;height:76px;border-radius:50%;transform:rotate(12deg);box-shadow:3px 3px 0 var(--ink);border:2.5px solid var(--ink)}
.spark{position:absolute;font-size:22px;font-weight:800;color:var(--purple)}
</style></head><body>
<svg class="sq" viewBox="0 0 1200 200" fill="none" stroke-linecap="round">
 <path d="M-20 150 C 40 60, 90 200, 150 110 S 250 20, 300 120 S 380 190, 440 90" stroke="#5C0099" stroke-width="11"/>
 <path d="M-20 60 C 30 10, 70 110, 120 60 S 200 -10, 250 50 S 330 130, 380 40 S 430 0, 460 30" stroke="#FFEB33" stroke-width="8"/>
 <path d="M60 210 C 100 160, 160 230, 200 175 S 290 150, 330 200" stroke="#03071E" stroke-width="5"/>
 <path d="M150 -10 C 180 30, 220 -5, 250 25" stroke="#fff" stroke-width="5"/>
 <circle cx="330" cy="38" r="14" fill="#FFEB33" stroke="#03071E" stroke-width="2.5"/>
 <circle cx="410" cy="170" r="9" fill="#fff"/>
 <circle cx="1105" cy="20" r="7" fill="#5C0099"/>
</svg>
<div class="spark" style="left:416px;top:16px">✳</div>
<div class="spark" style="left:775px;top:152px;color:#03071E">✳</div>
<div class="head"><small>GENERALIST WORLD</small>
<h1><span class="hl">Community</span><i>,</i> Newsletter <i>&amp;</i> Events</h1></div>
<div class="stats">
 <div class="st s1"><b>800+</b>members</div>
 <div class="st s2"><b>55,000</b>readers</div>
 <div class="st s3"><b>100s</b>of events</div>
</div>
<div class="card"><div class="tape"></div><img src="comment.png"></div>
<img class="logo" src="logo.png">
</body></html>
