<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:200px;overflow:hidden}
body{font-family:'Inter Display','Inter',sans-serif;background:#FFF3E2;position:relative;color:#1B1B3A}
svg.sq{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%}
.head{position:absolute;left:470px;top:28px;width:300px}
.head small{display:inline-block;background:#1B1B3A;color:#FFC93C;font-weight:800;font-size:12px;letter-spacing:2px;padding:4px 10px;border-radius:999px;transform:rotate(-3deg)}
.head h1{margin-top:8px;font-weight:900;font-size:31px;line-height:1;letter-spacing:-1px}
.head h1 .c{color:#FF5A4E}.head h1 .t{color:#1FA595}.head h1 .p{color:#7B5CFF}
.stats{position:absolute;left:462px;top:136px;display:flex;gap:8px}
.st{border:2.5px solid #1B1B3A;border-radius:12px;padding:4px 10px 5px;box-shadow:3px 3px 0 #1B1B3A;font-size:11px;font-weight:700;line-height:1.05}
.st b{display:block;font-size:20px;font-weight:900;letter-spacing:-.5px}
.s1{background:#FFC93C;transform:rotate(-4deg)}.s2{background:#8FE3D6;transform:rotate(3deg)}.s3{background:#FFB3C7;transform:rotate(-2deg)}
.card{position:absolute;right:52px;top:38px;background:#fff;border:2.5px solid #1B1B3A;border-radius:16px;padding:6px 8px;box-shadow:6px 6px 0 #1B1B3A;transform:rotate(2.5deg)}
.card img{display:block;width:372px;height:auto;border-radius:8px}
.tape{position:absolute;top:-12px;left:50%;width:84px;height:22px;margin-left:-42px;background:rgba(255,201,60,.85);transform:rotate(-6deg)}
.burst{position:absolute;right:20px;top:118px;width:74px;height:74px;transform:rotate(12deg)}
.burst span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Color Emoji';font-size:30px}
.spark{position:absolute;font-size:22px;color:#FF5A4E;font-weight:900}
</style></head><body>
