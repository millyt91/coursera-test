<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:200px;overflow:hidden}
body{font-family:'Inter Display','Inter',sans-serif;background:#0f1b3d;position:relative;color:#fff}
.bg{position:absolute;inset:0;background:
 radial-gradient(circle at 18% 120%,rgba(255,111,97,.55),transparent 45%),
 radial-gradient(circle at 40% -30%,rgba(124,92,255,.45),transparent 50%),
 linear-gradient(100deg,#0f1b3d 0%,#16245a 55%,#1b2b6b 100%)}
.gw{position:absolute;left:150px;top:50%;transform:translateY(-50%);font-weight:900;font-size:230px;letter-spacing:-12px;color:rgba(255,255,255,.06);line-height:1}
.dots{position:absolute;left:330px;top:30px;width:150px;height:140px;
 background-image:radial-gradient(rgba(255,255,255,.22) 1.6px,transparent 1.8px);background-size:16px 16px}
.bar{position:absolute;right:0;top:0;bottom:0;width:8px;background:linear-gradient(#ff6f61,#ffb347)}
.quote{position:absolute;right:70px;top:50%;transform:translateY(-50%);text-align:right;width:600px}
.mark{position:absolute;right:560px;top:-34px;font-family:'Liberation Serif',serif;font-size:130px;color:#ff6f61;line-height:1;opacity:.9}
.text{font-weight:800;font-size:46px;letter-spacing:-1px;line-height:1.1}
.text b{color:#ffb347;font-weight:900}
.emoji{font-family:'Noto Color Emoji';font-size:40px;vertical-align:2px;margin-left:6px}
.who{margin-top:14px;font-size:16px;font-weight:600;letter-spacing:.3px;color:rgba(255,255,255,.85)}
.who span{color:rgba(255,255,255,.55);font-weight:500}
.rule{display:inline-block;width:28px;height:2px;background:#ff6f61;vertical-align:middle;margin-right:10px}
</style></head><body>
<div class="bg"></div><div class="gw">GW</div><div class="dots"></div><div class="bar"></div>
<div class="quote"><div class="mark">&ldquo;</div>
<div class="text">GW is <b>THE</b> community<span class="emoji">🫶</span></div>
<div class="who"><i class="rule"></i>Valeria Collu <span>· Leadership Coach</span></div></div>
</body></html>
