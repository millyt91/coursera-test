<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:200px;overflow:hidden}
body{font-family:'Inter Display','Inter',sans-serif;background:#0f1b3d;position:relative;color:#fff}
.bg{position:absolute;inset:0;background:
 radial-gradient(circle at 18% 120%,rgba(255,111,97,.55),transparent 45%),
 radial-gradient(circle at 40% -30%,rgba(124,92,255,.45),transparent 50%),
 linear-gradient(100deg,#0f1b3d 0%,#16245a 55%,#1b2b6b 100%)}
.gw{position:absolute;left:150px;top:50%;transform:translateY(-50%);font-weight:900;font-size:230px;letter-spacing:-12px;color:rgba(255,255,255,.06);line-height:1}
.dots{position:absolute;left:330px;top:30px;width:150px;height:140px;
 background-image:radial-gradient(rgba(255,255,255,.22) 1.6px,transparent 1.8px);background-size:16px 16px}
.bar{position:absolute;right:0;top:0;bottom:0;width:8px;background:linear-gradient(#ff6f61,#ffb347)}
.wrap{position:absolute;right:56px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:26px}
.kick{text-align:right;color:#fff}
.kick small{display:block;font-size:13px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:#ffb347;margin-bottom:6px}
.kick div{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.kick .sep{color:#ff6f61}
.card{position:relative;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 18px 40px rgba(5,10,30,.45),0 0 0 1px rgba(255,255,255,.15)}
.card img{display:block;width:480px;height:auto}
.mark{position:absolute;left:-22px;top:-40px;font-family:'Liberation Serif',serif;font-size:110px;color:#ff6f61;line-height:1}
</style></head><body>
<div class="bg"></div><div class="gw">GW</div><div class="dots"></div><div class="bar"></div>
<div class="wrap"><div class="kick"><small>GW</small><div>Community<br><span class="sep">·</span> Newsletter<br><span class="sep">·</span> Events</div></div>
<div class="card"><div class="mark">&ldquo;</div><img src="comment.png"></div></div>
</body></html>
